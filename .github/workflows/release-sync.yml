name: Refresh GitHub release data
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-data-sync
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate the latest complete release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_release.py
      - name: Publish changed data
        run: |
          if ! git diff --quiet -- release-data.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add release-data.json
            git commit -m 'Refresh release downloads and checksums'
            git push
          fi
